<!DOCTYPE html>
<html lang="ko">
<head>

<title>광야(曠野)</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }
    body{
        width:960px;
        margin:0 auto;
        overflow:hidden;
    }
    #menu{
        width:260px;
        float:left;
    }
    #section{
        width:700px;
        float:right;
    }
    li{
        list-style:none;
        padding:10px;
    }

    .font_first{
        font-family:"Malgun Gothic", sans-serif;
    }

    .font_second{
        font-family:"궁서", serif;
    }

    .font_big{
        font-size:2em;
        margin-bottom:20px;
    }

    .font_small{
        font-size:1em;
        line-height:2.2; 
    }

    @media screen and (max-width:767px){
        body{
            width:auto;
        }

        #menu,
        #section{
            width:auto;
            float:none;
        }
    }
</style>
</head>

<body>

<div id="menu">
    <ul>
        <li>메뉴A</li>
        <li>메뉴B</li>
        <li>메뉴C</li>
    </ul>
</div>
<div id="section">
    <h1 class="font_first font_big">광야(曠野)</h1>

    <p class="font_second font_small">
        까마득한 날에<br>
        하늘이 처음 열리고<br>
        어데 닭 우는 소리 들렸으랴<br>
        모든 산맥(山脈)들이<br>
        바다를 연모(戀慕)해 휘달릴 때도<br>
        참아 그곳을 범(犯)하던 못하였으리라<br>
        끊임없는 광음(光陰)을<br>
        부즈런한 계절(季節)이 피여선 지고<br>
        큰 강(江)물이 비로소 길을 열었다<br>
        지금 눈 나리고<br>
        매화향기(梅花香氣) 홀로 아득하니<br>
        내 여기 가난한 노래의 씨를 뿌려라<br>
        다시 천고(千古)의 뒤에<br>
        백마(白馬) 타고 오는 초인(超人)이 있어<br>
        이 광야(曠野)에서 목놓아 부르게 하리라
    </p>
</div>

</body>
</html>
